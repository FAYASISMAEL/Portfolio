<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Login | Fayas Ismael</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Manrope:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav id="navbar" aria-label="Main navigation"><a href="/index.html" class="nav-logo">A 'കുട്ടി' Developer<span>.</span></a><a href="/index.html" class="project-link">Portfolio →</a></nav>
  <main id="main">
    <section class="login-section">
      <div class="about-label">Portfolio manager</div>
      <h1 class="section-title">Welcome back.</h1>
      <p class="admin-intro">Log in to manage your projects and experience.</p>
      <form id="login-form">
        <div class="form-group"><label for="username">Email / Username</label><input id="username" name="username" autocomplete="username" maxlength="100" required></div>
        <div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required></div>
        <p class="feedback" id="login-feedback" role="alert"></p>
        <button class="submit-btn" type="submit">Log In →</button>
      </form>
      <noscript>Enable JavaScript to log in.</noscript>
    </section>
  </main>
  <footer><span class="footer-copy">© 2026 Fayas Ismael. All rights reserved.</span></footer>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
